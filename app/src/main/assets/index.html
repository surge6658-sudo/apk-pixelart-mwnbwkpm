<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Art Stüdyo</title>
<style>
:root{--bg:#f2f3f7;--panel:#fff;--text:#1c1e26;--mut:#6b7080;--line:#d9dce6;--acc:#6c4cff;--acc-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151b;--panel:#1d1f28;--text:#eceef5;--mut:#9aa0b4;--line:#2d3040;--acc:#8b73ff;--acc-t:#fff}}
:root[data-theme="dark"]{--bg:#14151b;--panel:#1d1f28;--text:#eceef5;--mut:#9aa0b4;--line:#2d3040;--acc:#8b73ff;--acc-t:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{padding:10px 12px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
header span{color:var(--mut);font-weight:400;font-size:12px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 10px 8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px}
input[type=number]{width:72px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
input[type=color]{width:42px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
input[type=range]{width:110px;accent-color:var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:4px;max-width:100%}
.sw i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);cursor:pointer;display:block}
.sep{width:1px;height:24px;background:var(--line)}
#view{flex:1;margin:0 10px 10px;border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel);min-height:300px;max-height:calc(100vh - 40px);position:relative}
#stage{position:relative;margin:16px;touch-action:none;width:max-content;box-shadow:0 2px 14px rgba(0,0,0,.25)}
#cv{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#chk{position:absolute;inset:0;z-index:-1;background-color:#fff}
#grid{position:absolute;inset:0;pointer-events:none}
#info{font-size:12px;color:var(--mut);margin:0 12px 10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov .box{background:var(--panel);border-radius:14px;padding:14px;max-width:100%;max-height:100%;overflow:auto;text-align:center}
#ov img{image-rendering:pixelated;max-width:100%;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>Pixel Art Stüdyo <span id="pos">—</span></header>

<div class="bar">
  <label>Genişlik <input id="w" type="number" min="1" value="32"></label>
  <label>Yükseklik <input id="h" type="number" min="1" value="32"></label>
  <button class="pri" id="bNew">Yeni tuval</button>
  <button id="bRes">Boyutlandır</button>
</div>

<div class="bar">
  <button data-t="pen" class="on">✏️ Kalem</button>
  <button data-t="eraser">🧽 Silgi</button>
  <button data-t="fill">🪣 Doldur</button>
  <button data-t="pick">💧 Damlalık</button>
  <button data-t="line">╱ Çizgi</button>
  <button data-t="rect">▭ Kutu</button>
  <button data-t="rectf">■ Dolu</button>
</div>

<div class="bar">
  <input type="color" id="col" value="#000000">
  <div class="sw" id="pal"></div>
  <div class="sep"></div>
  <div class="sw" id="rec" title="Son kullanılanlar"></div>
</div>

<div class="bar">
  <button id="bUndo">↶ Geri</button>
  <button id="bRedo">↷ İleri</button>
  <button id="bClear">Temizle</button>
  <div class="sep"></div>
  <label>Yakınlaştır <input id="zoom" type="range" min="1" max="80" value="14"></label>
  <button id="bFit">Sığdır</button>
  <button id="bGrid" class="on">Izgara</button>
  <div class="sep"></div>
  <button class="pri" id="bExp">Dışa aktar</button>
</div>

<div id="view"><div id="stage"><div id="chk"></div><canvas id="cv"></canvas><div id="grid"></div></div></div>
<p id="info">Kısayollar: B kalem · E silgi · G doldur · I damlalık · L çizgi · R kutu · Ctrl+Z / Ctrl+Y</p>

<div id="ov"><div class="box">
  <p style="margin:0 0 8px">Ölçeği seç, “Kaydet”e bas ve telefona kaydet.</p>
  <label style="font-size:13px">Ölçek: <input id="scale" type="number" min="1" value="16" style="width:70px"></label>
  <button id="bMk">Oluştur</button>
  <div style="margin:10px 0"><img id="out" alt="Pixel art"></div>
  <button class="pri" id="bSave">Kaydet (PNG)</button>
  <button id="bClose">Kapat</button>
  <p id="msg" style="font-size:12px;color:var(--mut);margin:8px 0 0"></p>
</div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),view=$('view');
var W=32,H=32,img,data,cell=14,tool='pen',hex='#000000',showGrid=true;
var undo=[],redo=[],recent=[];
var PAL=['#000000','#ffffff','#7f7f7f','#c3c3c3','#880015','#ed1c24','#ff7f27','#ffc90e','#fff200','#22b14c','#b5e61d','#00a2e8','#3f48cc','#a349a4','#ffaec9','#b97a57','#1a1c2c','#5d275d','#b13e53','#ef7d57','#ffcd75','#a7f070','#38b764','#257179','#29366f','#3b5dc9','#41a6f6','#73eff7','#f4f4f4','#94b0c2','#566c86','#333c57'];

function toInt(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return ((255<<24)|(b<<16)|(g<<8)|r)>>>0}
function toHex(n){var r=n&255,g=(n>>8)&255,b=(n>>16)&255;return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0')}).join('')}
function dim(el){var v=Math.floor(Number(el.value));return (isFinite(v)&&v>=1)?v:1}

function init(w,h,keep){
  var old=data,ow=W,oh=H;
  W=w;H=h;cv.width=W;cv.height=H;
  img=ctx.createImageData(W,H);data=new Uint32Array(img.data.buffer);
  if(keep&&old){for(var y=0;y<Math.min(H,oh);y++)for(var x=0;x<Math.min(W,ow);x++)data[y*W+x]=old[y*ow+x]}
  layout();draw();
}
function layout(){
  cv.style.width=W*cell+'px';cv.style.height=H*cell+'px';
  var c=$('chk');c.style.backgroundImage='repeating-conic-gradient(#d0d0d0 0 25%,#fff 0 50%)';
  c.style.backgroundSize=(cell*2)+'px '+(cell*2)+'px';
  var g=$('grid');
  if(showGrid&&cell>=6){g.style.backgroundImage='linear-gradient(to right,rgba(0,0,0,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.22) 1px,transparent 1px)';g.style.backgroundSize=cell+'px '+cell+'px'}
  else g.style.backgroundImage='none';
  $('info').dataset.s=W+'×'+H;
}
function draw(){ctx.putImageData(img,0,0)}
function snap(){undo.push({w:W,h:H,d:data.slice()});if(undo.length>60)undo.shift();redo=[]}
function restore(s){W=s.w;H=s.h;cv.width=W;cv.height=H;img=ctx.createImageData(W,H);data=new Uint32Array(img.data.buffer);data.set(s.d);$('w').value=W;$('h').value=H;layout();draw()}
function doUndo(){if(!undo.length)return;redo.push({w:W,h:H,d:data.slice()});restore(undo.pop())}
function doRedo(){if(!redo.length)return;undo.push({w:W,h:H,d:data.slice()});restore(redo.pop())}

function set(x,y,v){if(x>=0&&y>=0&&x<W&&y<H)data[y*W+x]=v}
function line(x0,y0,x1,y1,v){
  var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
  for(;;){set(x0,y0,v);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}
}
function rect(x0,y0,x1,y1,v,f){
  var a=Math.min(x0,x1),b=Math.max(x0,x1),c=Math.min(y0,y1),d=Math.max(y0,y1);
  for(var y=c;y<=d;y++)for(var x=a;x<=b;x++){if(f||x===a||x===b||y===c||y===d)set(x,y,v)}
}
function flood(x,y,v){
  if(x<0||y<0||x>=W||y>=H)return;
  var t=data[y*W+x];if(t===v)return;
  var st=[x,y];
  while(st.length){var cy=st.pop(),cx=st.pop();
    if(cx<0||cy<0||cx>=W||cy>=H||data[cy*W+cx]!==t)continue;
    data[cy*W+cx]=v;st.push(cx+1,cy,cx-1,cy,cx,cy+1,cx,cy-1)}
}

function cellAt(e){var r=cv.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]}
function useColor(h){hex=h;$('col').value=h;if(tool==='eraser')setTool('pen')}
function addRecent(h){recent=recent.filter(function(c){return c!==h});recent.unshift(h);recent=recent.slice(0,10);renderRecent()}

var drawing=false,start=null,last=null,base=null;
cv.addEventListener('pointerdown',function(e){
  if(e.button>0)return;
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  var p=cellAt(e),x=p[0],y=p[1];
  if(tool==='pick'){
    if(x>=0&&y>=0&&x<W&&y<H&&data[y*W+x]>>>24){useColor(toHex(data[y*W+x]))}
    return;
  }
  snap();drawing=true;start=p;last=p;
  var v=tool==='eraser'?0:toInt(hex);
  if(tool==='fill'){flood(x,y,v);draw();addRecent(hex);drawing=false;return}
  if(tool==='pen'||tool==='eraser'){set(x,y,v);draw()}
  else base=data.slice();
});
cv.addEventListener('pointermove',function(e){
  var p=cellAt(e);
  $('pos').textContent=(p[0]>=0&&p[1]>=0&&p[0]<W&&p[1]<H)?(p[0]+', '+p[1]+'  ·  '+W+'×'+H):(W+'×'+H);
  if(!drawing)return;
  var v=tool==='eraser'?0:toInt(hex);
  if(tool==='pen'||tool==='eraser'){line(last[0],last[1],p[0],p[1],v);last=p}
  else{data.set(base);
    if(tool==='line')line(start[0],start[1],p[0],p[1],v);
    else rect(start[0],start[1],p[0],p[1],v,tool==='rectf')}
  draw();
});
function end(){if(!drawing)return;drawing=false;base=null;if(tool!=='eraser')addRecent(hex)}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)})}
document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){setTool(b.dataset.t)}});

function renderPal(){var p=$('pal');p.innerHTML='';PAL.forEach(function(c){var i=document.createElement('i');i.style.background=c;i.onclick=function(){useColor(c)};p.appendChild(i)})}
function renderRecent(){var p=$('rec');p.innerHTML='';recent.forEach(function(c){var i=document.createElement('i');i.style.background=c;i.onclick=function(){useColor(c)};p.appendChild(i)})}
$('col').oninput=function(){hex=this.value;if(tool==='eraser')setTool('pen')};

$('bNew').onclick=function(){
  var w=dim($('w')),h=dim($('h'));$('w').value=w;$('h').value=h;
  if(data.some(function(v){return v})&&!confirm('Mevcut çizim silinecek. Yeni tuval açılsın mı?'))return;
  snap();init(w,h,false);
};
$('bRes').onclick=function(){var w=dim($('w')),h=dim($('h'));$('w').value=w;$('h').value=h;snap();init(w,h,true)};
$('bUndo').onclick=doUndo;$('bRedo').onclick=doRedo;
$('bClear').onclick=function(){snap();data.fill(0);draw()};
$('zoom').oninput=function(){cell=Math.max(1,Number(this.value));layout()};
$('bFit').onclick=function(){
  var aw=view.clientWidth-40,ah=Math.min(view.clientHeight,window.innerHeight*0.7)-40;
  cell=Math.max(1,Math.floor(Math.min(aw/W,ah/H)));
  $('zoom').value=Math.min(cell,80);layout();
};
$('bGrid').onclick=function(){showGrid=!showGrid;this.classList.toggle('on',showGrid);layout()};
view.addEventListener('wheel',function(e){
  if(!e.ctrlKey)return;e.preventDefault();
  cell=Math.max(1,cell+(e.deltaY<0?1:-1));$('zoom').value=Math.min(cell,80);layout();
},{passive:false});

function make(){
  var s=Math.max(1,Math.floor(Number($('scale').value))||1);
  var c=document.createElement('canvas');c.width=W*s;c.height=H*s;
  var x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(cv,0,0,W*s,H*s);
  try{$('out').src=c.toDataURL('image/png')}catch(err){alert('Bu boyut için görsel oluşturulamadı, ölçeği küçült.')}
  lastCanvas=c;
}
var lastCanvas=null;
$('bSave').onclick=function(){
  var m=$('msg');m.textContent='';
  if(!lastCanvas)make();
  var name='pixel-art-'+W+'x'+H+'.png';
  lastCanvas.toBlob(async function(b){
    if(!b){m.textContent='Görsel oluşturulamadı, ölçeği küçült.';return}
    var ok=function(){m.textContent='Kaydedildi ✓'};
    // 1) APK / WebView köprüsü: Android tarafında @JavascriptInterface saveImage(base64, ad)
    try{
      if(window.Android&&typeof window.Android.saveImage==='function'){
        var r=new FileReader();
        r.onload=function(){window.Android.saveImage(String(r.result).split(',')[1],name);ok()};
        r.readAsDataURL(b);return;
      }
    }catch(e){}
    // 2) claude.ai içinde
    try{
      var dl=window.claude&&await window.claude.use('downloads');
      if(dl){await dl.save({filename:name,data:b});ok();return}
    }catch(e){if(e&&e.code==='declined'){m.textContent='İptal edildi.';return}}
    // 3) Paylaşım menüsü (Galeriye kaydet seçeneği çıkar)
    try{
      var f=new File([b],name,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});ok();return}
    }catch(e){if(e&&e.name==='AbortError'){m.textContent='İptal edildi.';return}}
    // 4) Normal tarayıcı indirmesi
    try{
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);ok();
    }catch(e){m.textContent='Kaydedilemedi.'}
  },'image/png');
};
$('bExp').onclick=function(){$('scale').value=Math.max(1,Math.floor(512/Math.max(W,H)));$('msg').textContent='';$('ov').style.display='flex';make()};
$('bMk').onclick=make;
$('bClose').onclick=function(){$('ov').style.display='none'};

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'&&e.target.type!=='color')return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();doRedo();return}
  var m={b:'pen',e:'eraser',g:'fill',i:'pick',l:'line',r:'rect'};
  if(m[k])setTool(m[k]);
});

renderPal();init(32,32,false);$('bFit').click();
})();
</script>
</body>
</html>
